<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OptiBot</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, system-ui, sans-serif;
         background: #0f1117; color: #e6e6e6; display: flex; justify-content: center; }
  main { width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 16px 20px; border-bottom: 1px solid #262a35; font-weight: 600; }
  header small { display: block; font-weight: 400; color: #8a91a0; margin-top: 2px; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: #2b6cff; color: #fff; border-bottom-right-radius: 4px; }
  .bot  { align-self: flex-start; background: #1b1f2a; border: 1px solid #262a35; border-bottom-left-radius: 4px; }
  .bot a { color: #6ea8ff; }
  form { display: flex; gap: 8px; padding: 16px 20px; border-top: 1px solid #262a35; }
  input { flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #333a48;
          background: #1b1f2a; color: #e6e6e6; font-size: 15px; }
  button { padding: 11px 18px; border: 0; border-radius: 10px; background: #2b6cff; color: #fff;
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <header>OptiBot <small>OptiSigns support · grounded on 408 help-center articles</small></header>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask about OptiSigns…" required>
    <button id="send">Send</button>
  </form>
</main>
<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');

  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function renderMarkdown(s) {
    let html = esc(s);
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/(?<!["'=])(https?:\/\/[^\s<)]+)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/^[ \t]*[*-][ \t]+/gm, '• ');
    return html;
  }

  function add(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.innerHTML = who === 'bot' ? renderMarkdown(text) : esc(text);
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    add(q, 'user');
    input.value = '';
    send.disabled = true;
    const thinking = add('…', 'bot');
    try {
      const r = await fetch('/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      });
      const data = await r.json();
      thinking.innerHTML = renderMarkdown(data.answer || data.error || 'No answer.');
    } catch (err) {
      thinking.textContent = 'Error: ' + err.message;
    }
    send.disabled = false;
    input.focus();
  });

  add("Hi! I'm OptiBot, your AI assistant for OptiSigns. I can help you with setup, troubleshooting, managing your screens, playlists, and schedules. How can I help you today?", 'bot');
</script>
</body>
</html>
